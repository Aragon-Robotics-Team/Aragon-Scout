<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      try {
        var t = JSON.parse(localStorage.getItem('as.theme-applied') || 'null')
        if (t) {
          var base = t.mode === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t.base
          document.documentElement.dataset.theme = base
          for (var k in t.vars) document.documentElement.style.setProperty('--color-' + k, t.vars[k])
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Real-time match scouting for the FTC BioBuzz season" />
    <title>Aragon Scout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
